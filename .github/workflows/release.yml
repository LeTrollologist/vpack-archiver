name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: vpack-archiver.exe
            asset_name: vpack-archiver-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: vpack-archiver
            asset_name: vpack-archiver-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: vpack-archiver
            asset_name: vpack-archiver-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: vpack-archiver
            asset_name: vpack-archiver-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Binary Artifact
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} staging/${{ matrix.asset_name }}
          cp README.md LICENSE staging/
          cd staging
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../vpack-archiver-${{ github.ref_name }}-${{ matrix.target }}.zip *
          else
            tar -czvf ../vpack-archiver-${{ github.ref_name }}-${{ matrix.target }}.tar.gz *
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/${{ matrix.asset_name }}
            vpack-archiver-${{ github.ref_name }}-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
