[package]
name        = "vpack-gui"
version     = "2.0.0"
edition     = "2021"
authors     = ["VPack Community"]
license     = "MIT OR Apache-2.0"
description = "VPack Archiver GUI — native WinRAR-style desktop archive manager"

[[bin]]
name = "vpack-gui"
path = "src/main.rs"

[dependencies]
vpack-archiver = { path = ".." }
tao            = { version = "0.31", features = ["rwh_06"] }
wry            = { version = "0.47" }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
rfd            = "0.15"
anyhow         = "1"
chrono         = { version = "0.4", features = ["serde"] }
flate2         = "1.0"
lz4_flex       = { version = "0.11", features = ["frame"] }

