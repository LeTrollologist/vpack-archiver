[package]
name        = "vpack-archiver"
version     = "1.0.0"
edition     = "2021"
authors     = ["VeloceSolutions"]
license     = "MIT OR Apache-2.0"
description = "VPack Archiver (WinRAR for .vpack) - Modern, cross-platform archive manager, compressor, and explorer for .vpack format"
repository  = "https://github.com/LeTrollologist/vpack-archiver"

[[bin]]
name = "vpack-archiver"
path = "src/main.rs"

[dependencies]
anyhow        = "1"
clap          = { version = "4", features = ["derive"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
toml          = "0.8"
bincode       = "1"
flate2        = "1.0"
crc32fast     = "1.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand          = "0.8"

[profile.release]
opt-level     = 3
lto           = "thin"
strip         = true
codegen-units = 1
