[workspace]
members  = ["gui", "installer"]
resolver = "2"

[package]
name        = "vpack-archiver"
version     = "2.0.1"
edition     = "2021"
authors     = ["VPack Community"]
license     = "MIT OR Apache-2.0"
description = "VPack Archiver - Modern, ultra-fast universal archive manager, compressor, and explorer"
repository  = "https://github.com/LeTrollologist/vpack-archiver"

[[bin]]
name = "vpack-archiver"
path = "src/main.rs"

[lib]
name = "vpack_core"
path = "src/lib.rs"

[dependencies]
anyhow        = "1"
clap          = { version = "4", features = ["derive"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
bincode       = "1"
flate2        = "1.0"
lz4_flex      = { version = "0.11", features = ["frame"] }
crc32fast     = "1.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand          = "0.8"
chrono        = { version = "0.4", features = ["serde"] }
sha2          = "0.10"

[profile.release]
opt-level     = 3
lto           = "thin"
strip         = true
codegen-units = 1
